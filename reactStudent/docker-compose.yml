services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: student_registration
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password_dev
      MYSQL_ROOT_PASSWORD: root_password_dev
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password_dev"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:mysql://mysql:3306/student_registration?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: app_user
      DB_PASSWORD: app_password_dev
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./student-registration-system
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
